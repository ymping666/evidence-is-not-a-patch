name: Rebuild paper PDF and validate release
on:
  push:
    branches: [main]
    paths:
      - 'paper/paper.md'
      - 'paper/references.bib'
      - '.github/workflows/rebuild-paper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core poppler-utils
          python -m pip install -r requirements-render.txt
      - name: Build PDF from citation-updated manuscript
        run: python -B scripts/build_pdf.py
      - name: Update hashes, count words, and validate release
        run: |
          python -B scripts/rebuild_release.py
          python -B scripts/check_release.py
      - name: Commit generated PDF and release hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/paper.pdf paper/build_receipt.json release_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild PDF with 17 verified references"
            git push
          fi
