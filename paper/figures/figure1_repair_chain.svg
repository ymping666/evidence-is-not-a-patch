<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Repair realization has multiple observable links</title><desc id="desc">Conceptual audit map. No stage is asserted necessary for every task; supplied correct candidates may bypass new editing.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="28" y="35" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" fill="#182b3a">Repair realization links</text>
<rect x="28" y="72" width="210" height="116" rx="8" fill="#f2f6f9" stroke="#cbdce9"/>
<text x="42" y="103" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#182b3a">Repair intent</text>
<text x="42" y="136" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#526473">Concrete operation</text>
<text x="42" y="162" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#526473">and Issue behavior</text>
<line x1="241" y1="129" x2="252" y2="129" stroke="#526473" stroke-width="2"/><polygon points="260,129 251,124 251,134" fill="#526473"/>
<rect x="263" y="72" width="210" height="116" rx="8" fill="#f2f6f9" stroke="#cbdce9"/>
<text x="277" y="103" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#182b3a">Tool execution</text>
<text x="277" y="136" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#526473">Accepted operation</text>
<text x="277" y="162" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#526473">and actual source diff</text>
<line x1="476" y1="129" x2="487" y2="129" stroke="#526473" stroke-width="2"/><polygon points="495,129 486,124 486,134" fill="#526473"/>
<rect x="498" y="72" width="210" height="116" rx="8" fill="#f2f6f9" stroke="#cbdce9"/>
<text x="512" y="103" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#182b3a">Local evidence</text>
<text x="512" y="136" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#526473">Behavior coverage</text>
<text x="512" y="162" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#526473">and current source</text>
<line x1="711" y1="129" x2="722" y2="129" stroke="#526473" stroke-width="2"/><polygon points="730,129 721,124 721,134" fill="#526473"/>
<rect x="733" y="72" width="210" height="116" rx="8" fill="#f2f6f9" stroke="#cbdce9"/>
<text x="747" y="103" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#182b3a">Artifact handoff</text>
<text x="747" y="136" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#526473">Retained patch</text>
<text x="747" y="162" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#526473">and submit timing</text>
<line x1="946" y1="129" x2="957" y2="129" stroke="#526473" stroke-width="2"/><polygon points="965,129 956,124 956,134" fill="#526473"/>
<rect x="968" y="72" width="210" height="116" rx="8" fill="#f2f6f9" stroke="#cbdce9"/>
<text x="982" y="103" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#182b3a">External result</text>
<text x="982" y="136" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#526473">Returned artifact</text>
<text x="982" y="162" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#526473">passes fixed grading</text>
<text x="28" y="231" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#526473">Descriptive, not causal.</text>
</svg>
