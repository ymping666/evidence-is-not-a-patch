<text x="28" y="359" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#182b3a">Filter-only</text>
<text x="230" y="359" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#526473">Later CPU ablation</text>
<rect x="500" y="341" width="360" height="24" rx="0" fill="#25736d"/>
<rect x="860" y="341" width="120" height="24" rx="0" fill="#a84343"/>
<text x="1005" y="359" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#182b3a">6 PASS / 2 FAIL</text>
<text x="28" y="421" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#526473">Code ablation, not prompt causality.</text>
</svg>
